{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}NeighborAlert{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body class="bg-gray-100 font-sans flex flex-col min-h-screen text-gray-800">
    {% include 'navbar.html' %}

    <main class="flex-grow">{% block content %}{% endblock %}</main>

    {% include 'footer.html' %}

    <!-- Global Centralized Auth Helper JS -->
    <script src="{% static 'js/auth.js' %}"></script>
  </body>
</html>
