<!-- Navbar Authentication Script -->
<script>
  // Toggle Mobile Menu
  const menuBtn = document.getElementById("menu-btn");
  const mobileMenu = document.getElementById("mobile-menu");
  const iconOpen = document.getElementById("menu-icon-open");
  const iconClose = document.getElementById("menu-icon-close");

  if (menuBtn) {
    menuBtn.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
      iconOpen.classList.toggle("hidden");
      iconClose.classList.toggle("hidden");
    });
  }

  // Check Auth State on Page Load
  async function checkAuthState() {
    const token = localStorage.getItem("access_token");

    const navGuest = document.getElementById("nav-guest");
    const navUser = document.getElementById("nav-user");
    const mobileGuest = document.getElementById("mobile-guest");
    const mobileUser = document.getElementById("mobile-user");

    if (token) {
      try {
        // Fetch logged-in user details
        const res = await fetch("/api/auth/profile", {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (res.ok) {
          const user = await res.json();

          // UI Switch to Logged In State
          if (navGuest) navGuest.classList.add("hidden");
          if (navUser) navUser.classList.remove("hidden");
          if (mobileGuest) mobileGuest.classList.add("hidden");
          if (mobileUser) mobileUser.classList.remove("hidden");

          document.getElementById("nav-username").innerText =
            user.username || "Profile";
          document.getElementById("mobile-username").innerText =
            `👤 ${user.username}`;
          return;
        }
      } catch (err) {
        console.error("Auth Check Failed", err);
      }
    }

    // Default: Show Guest Buttons (Login/Register)
    if (navGuest) navGuest.classList.remove("hidden");
    if (navUser) navUser.classList.add("hidden");
    if (mobileGuest) mobileGuest.classList.remove("hidden");
    if (mobileUser) mobileUser.classList.add("hidden");
  }

  // Logout Functionality
  function logoutUser() {
    localStorage.removeItem("access_token");
    localStorage.removeItem("refresh_token");
    alert("Logged out successfully!");
    window.location.href = "{% url 'login_page' %}";
  }

  // Execute check on page load
  checkAuthState();
</script>
