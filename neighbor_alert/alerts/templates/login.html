{% extends 'base.html' %}
<!--  -->
{% block title %}User Login - NeighborAlert BD{% endblock %}
<!--  -->
{% block content %}
<!-- SweetAlert2 CDN নোটিফিকেশনের জন্য -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="min-h-[75vh] flex items-center justify-center py-12 px-4">
  <div
    class="max-w-md w-full bg-white p-8 rounded-3xl shadow-lg border border-gray-100 space-y-6"
  >
    <div class="text-center">
      <h2 class="text-3xl font-extrabold text-gray-900">Welcome Back</h2>
      <p class="text-xs text-gray-500 mt-2">
        Log in to your account to report incidents & stay updated.
      </p>
    </div>

    <!-- JavaScript দিয়ে হ্যান্ডেল করার জন্য ফর্ম আইডি দেওয়া হলো -->
    <form id="loginForm" class="space-y-4">
      {% csrf_token %}

      <div
        id="errorAlert"
        class="hidden bg-red-50 border border-red-200 text-red-600 text-xs p-3 rounded-xl text-center font-medium"
      >
        Invalid username or password. Please try again.
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase mb-1"
          >Username</label
        >
        <input
          type="text"
          id="usernameInput"
          required
          placeholder="Enter username"
          class="w-full border rounded-xl p-3 text-sm bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase mb-1"
          >Password</label
        >
        <input
          type="password"
          id="passwordInput"
          required
          placeholder="••••••••"
          class="w-full border rounded-xl p-3 text-sm bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none"
        />
      </div>
      <button
        type="submit"
        id="loginBtn"
        class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow-md"
      >
        Sign In
      </button>
    </form>

    <p class="text-xs text-center text-gray-500">
      Don't have an account?
      <a
        href="{% url 'register_page' %}"
        class="text-red-600 font-bold hover:underline"
        >Register now</a
      >
    </p>
  </div>
</div>

<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const btn = document.getElementById("loginBtn");
    const errorAlert = document.getElementById("errorAlert");
    const username = document.getElementById("usernameInput").value.trim();
    const password = document.getElementById("passwordInput").value;

    errorAlert.classList.add("hidden");
    btn.disabled = true;
    btn.innerText = "Signing in...";

    try {
      // আপনার urls.py এ থাকা /api/auth/login/ রাউটে রিকোয়েস্ট পাঠানো হচ্ছে
      const response = await fetch("/api/auth/login/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ username, password }),
      });

      const data = await response.json();

      if (response.ok) {
        // সফলভাবে টোকেন লোকাল স্টোরেজে সেভ হচ্ছে
        localStorage.setItem("access_token", data.access);
        localStorage.setItem("refresh_token", data.refresh);

        Swal.fire({
          toast: true,
          position: "top-end",
          icon: "success",
          title: "Login successful!",
          showConfirmButton: false,
          timer: 1500,
          timerProgressBar: true,
        });

        // ১.৫ সেকেন্ড পর কমিউনিটি পেজে পাঠিয়ে দেওয়া হবে
        setTimeout(() => {
          window.location.href = "/community/";
        }, 1500);
      } else {
        errorAlert.classList.remove("hidden");
        btn.disabled = false;
        btn.innerText = "Sign In";
      }
    } catch (err) {
      console.error("Login error:", err);
      errorAlert.innerText = "Network error occurred. Please try again.";
      errorAlert.classList.remove("hidden");
      btn.disabled = false;
      btn.innerText = "Sign In";
    }
  });
</script>
{% endblock %}
