{% extends 'base.html' %}
<!--  -->
{% block title %}User Login - NeighborAlert BD{% endblock %}
<!--  -->
{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4">
  <div
    class="max-w-md w-full bg-white p-8 rounded-3xl shadow-lg border border-gray-100 space-y-6"
  >
    <div class="text-center">
      <h2 class="text-3xl font-extrabold text-gray-900">Welcome Back</h2>
      <p class="text-xs text-gray-500 mt-2">
        Log in to your account to report incidents & stay updated.
      </p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase mb-1"
          >Username or Email</label
        >
        <input
          type="text"
          id="loginUser"
          required
          placeholder="Enter username"
          class="w-full border rounded-xl p-3 text-sm bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase mb-1"
          >Password</label
        >
        <input
          type="password"
          id="loginPass"
          required
          placeholder="••••••••"
          class="w-full border rounded-xl p-3 text-sm bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none"
        />
      </div>
      <button
        type="submit"
        id="loginBtn"
        class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow-md"
      >
        Sign In
      </button>
    </form>

    <p class="text-xs text-center text-gray-500">
      Don't have an account?
      <a
        href="{% url 'register_page' %}"
        class="text-red-600 font-bold hover:underline"
        >Register now</a
      >
    </p>
  </div>
</div>

<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    btn.innerText = "Authenticating...";
    btn.disabled = true;

    const payload = {
      username: document.getElementById("loginUser").value,
      password: document.getElementById("loginPass").value,
    };

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      const data = await res.json();
      if (res.ok) {
        localStorage.setItem("access_token", data.access);
        localStorage.setItem("refresh_token", data.refresh);
        alert("Login Successful!");
        window.location.href = "{% url 'dashboard_page' %}";
      } else {
        alert(data.detail || "Invalid login credentials.");
      }
    } catch (err) {
      alert("Server error. Please try again.");
    } finally {
      btn.innerText = "Sign In";
      btn.disabled = false;
    }
  });
</script>
{% endblock %}
